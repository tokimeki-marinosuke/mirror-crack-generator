<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>割れ鏡・中心線と独立反射の比較</title>
<style>body{margin:24px;background:#10141d;color:#edf2fa;font:15px system-ui}h1{font-size:24px}p{line-height:1.7;color:#b8c7d9}.controls{display:flex;gap:20px;flex-wrap:wrap;padding:16px;background:#202838}select,input{font:inherit;color:inherit;background:#303b50;padding:7px;border-radius:5px}label{display:grid;gap:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0}figcaption{margin:14px 0}canvas{width:100%;height:auto;background:repeating-conic-gradient(#334155 0% 25%,#1e293b 0% 50%) 0/16px 16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style>
<h1>同じ画像・シード・亀裂形状で描画を比較</h1><p>左上：旧シネマティック、右上：旧材質最大（破断面幅0）。左下：新シネマティック、右下：新材質最大。光源は225°で共通。亀裂生成と破片の形状は変更していません。</p>
<div class="controls"><label>画像<select id="sample"><option value="portrait">顔・文字の自作確認素材</option><option value="light">明るい背景</option><option value="dark">暗い背景</option><option value="transparent">透過画像</option></select></label><label>シード<input id="seed" type="number" value="42"></label><label>中心密度<select id="density"><option value="40">40%</option><option value="0">0%（保護）</option><option value="100">100%</option></select></label><label>黒い亀裂の太さ<input id="width" type="range" min="0.5" max="6" step="0.1" value="1"></label><label>新描画の反射幅<input id="reflection-width" type="range" min="0" max="100" value="65"></label></div>
<div class="grid"><figure><figcaption>旧シネマティック</figcaption><canvas id="old-default"></canvas></figure><figure><figcaption>旧材質最大・破断面幅0</figcaption><canvas id="old-max"></canvas></figure><figure><figcaption>新シネマティック（大きな欠けなし）</figcaption><canvas id="new-default"></canvas></figure><figure><figcaption>新材質最大（断面・反射区間を拡張）</figcaption><canvas id="new-max"></canvas></figure></div><p id="summary" role="status"></p><script type="module" src="./crisp-mirror.browser.ts"></script></html>
