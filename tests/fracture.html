<h1>第2段階 · 主要亀裂の破断面</h1><p>同じ中心線・シード42・中心密度0%。左は破断面幅0、右は破断面と反射縁を追加。細線幅とは独立しています。<br>これは開発用比較ページです。製品画面への操作UI追加、欠け・破片移動は後段で実装します。</p>

<main><figure><figcaption>従来の細線</figcaption><canvas id="baseline"></canvas></figure><figure><figcaption>主要亀裂の破断面＋片側の反射</figcaption><canvas id="surface"></canvas></figure></main>
