<!doctype html><html lang="ja"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>破片画像のずれ・回転 — 第3段階</title>
<style>body{font:15px system-ui;background:#10141d;color:#e9edf5;margin:24px}h1{font-size:25px}p{color:#b5c4d8;line-height:1.8}.controls{display:flex;flex-wrap:wrap;gap:20px;padding:20px;background:#1a202d;border-radius:10px}label{display:grid;gap:8px}input,select,button{font:inherit;color:inherit;background:#252f40;border:1px solid #526179;padding:7px;border-radius:5px}input[type=number]{width:100px}input[type=range]{padding:0;accent-color:#5ff5d2}output{color:#5ff5d2}main{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0}figcaption{margin:16px 0}canvas{width:100%;height:auto;background:repeating-conic-gradient(#334155 0% 25%,#1e293b 0% 50%) 0/16px 16px}[data-status=failed]{color:#ff9999}@media(max-width:900px){main{grid-template-columns:1fr}}</style>
<h1>破片画像のずれ・回転 · 第3段階</h1><p>輪郭を固定したまま、破片内に映る元画像だけをずらします。保護円と重なる破片全体と、面積順で256件から外れた破片は変形しません。通常画面・PNG出力には未接続の開発ページです。</p>
<div class="controls"><label>ケース<select id="scenario"></select></label><label>シード<input id="seed" type="number" value="42" step="1"></label><label>中心密度 <output id="density-value"></output><input id="density" type="range" min="0" max="100" value="50"></label><label>映りのずれ <output id="displacement-value"></output><input id="displacement" type="range" min="0" max="100" value="80"></label><label>映りの回転 <output id="rotation-value"></output><input id="rotation" type="range" min="0" max="100" value="80"></label><button id="zero">変形を0に戻す</button></div>
<main><figure><figcaption>元画像＋亀裂</figcaption><canvas id="baseline" width="800" height="500"></canvas></figure><figure><figcaption>破片内の画像を変形＋同じ亀裂</figcaption><canvas id="motion" width="800" height="500"></canvas></figure></main><p id="summary" role="status">読み込み中…</p><p>ずれ・回転の変更では領域を再抽出しません。両方0なら元画像を1回描くだけで従来表示へ戻ります。明暗差・隙間・製品UIへの接続は次段階です。</p><script type="module" src="./shard-motion.browser.ts"></script></html>
